<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de Recinto CVET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Fondo blanco, un solo tema. La ficha se lee en obra, con el teléfono a pleno sol y a veces
   mojado: el blanco es el que más brillo devuelve y el que coincide con la lámina impresa de
   Pitágora. Nada de tema oscuro — ni el del sistema ni el elegido — porque acá el contraste no
   es una preferencia de quien mira sino una condición de dónde se mira. */
:root{
  color-scheme:light;
  --ground:#FFFFFF; --surface:#FFFFFF; --surface2:#F4F7F9;
  --ink:#063358; --ink2:#20272E; --muted:#647180; --line:#D9E0E7;
  --steel:#95ABC6; --crit:#ED1C24; --crit-bg:#FDECEC; --crit-ink:#ED1C24;
  --ok:#063358; --pend:#95ABC6;
  --s1:#063358; --s2:#3E7CA8; --s3:#20272E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink2);
  font-family:Inter,Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 0 72px;display:flex;flex-direction:column;gap:12px}
.pad{padding:0 10px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Cabecera sobre blanco. La apertura ejecutiva —fondo grafito— se reserva para portadas y
   decisiones: usarla en los 125 recintos la gasta y además deja el logotipo azul y rojo sobre
   azul, donde no se lee. Acá la jerarquía la hace el tamaño, no el fondo. */
.hero{background:var(--surface);padding:14px 14px 15px;border-bottom:3px solid var(--ink)}
.hero .cod{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--steel)}
.hero h1{margin:2px 0 0;font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15;
  color:var(--ink);text-wrap:balance}
.hero .meta{margin-top:8px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
/* En el lockup, la palabra PITÁGORA ocupa el 51% del alto de la imagen. Para que se lea en el
   teléfono al mismo tamaño que el nombre del recinto —27px, mayúscula de ~19px— la imagen
   completa tiene que medir unos 40px. Debajo de eso la marca queda a menos de la mitad. */
.hero .logo{height:40px;width:auto;margin-bottom:14px;display:block}

/* sello de vigencia: una ficha que aparenta estar viva y miente es peor que el papel */
.sello{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:9px 14px;
  background:var(--surface2);border-bottom:1px solid var(--line);color:var(--muted)}
.sello .txt{flex:1;min-width:0}
.sello b{color:var(--ink2);font-weight:600}
.sello.viejo{background:var(--crit-bg);color:var(--crit-ink)}
.sello.viejo b{color:var(--crit-ink)}
.sello.sinred{background:#FFF6E6;color:#8A6410}
.sello.sinred b{color:#8A6410}
#btnAct{flex:none;font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;min-height:36px;
  border:1px solid var(--ink);border-radius:7px;background:var(--surface);color:var(--ink);cursor:pointer}
#btnAct:disabled{opacity:.55;cursor:default}
#btnAct:focus-visible{outline:2px solid var(--s2);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card>h2{margin:0;padding:12px 14px 10px;font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}

/* especialidad */
.esp{padding:12px 14px;border-bottom:1px solid var(--line)}
.esp:last-child{border-bottom:0}
.esp .enc{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.esp .nom{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink)}
.sw{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.esp .pc{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.esp .sub{font-size:12px;color:var(--muted);margin-top:2px}
.barra{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:9px 0 2px}
.barra i{display:block;height:100%;border-radius:3px}

ul.items{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:1px}
ul.items li{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
ul.items li:first-child{border-top:0}
.tick{flex:none;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:800;margin-top:1px}
.tick.si{background:var(--ink);color:var(--surface)}
.tick.no{background:transparent;border:1.5px dashed var(--pend);color:var(--pend)}
ul.items .d{flex:1;min-width:0}
ul.items .f{flex:none;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
ul.items li.pend .d{color:var(--muted)}

/* restricciones y compromisos */
.rojo{border-color:var(--crit)}
.rojo>h2{color:var(--crit-ink);background:var(--crit-bg);border-bottom-color:var(--crit)}
.it{padding:11px 14px;border-top:1px solid var(--line);font-size:14px}
.it:first-of-type{border-top:0}
.it .cab{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.id{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.venc{background:var(--crit);border-color:var(--crit);color:#fff}
.tag.perm{border-color:var(--steel);color:var(--steel)}
.it .pie{margin-top:5px;font-size:12px;color:var(--muted)}
.nota{font-size:12px;color:var(--muted);padding:10px 14px;background:var(--surface2);border-top:1px solid var(--line)}

/* reseña técnica del equipo · comprobación de recepción */
.dat{list-style:none;margin:0;padding:0}
.dat li{display:flex;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:14px}
.dat li:first-child{border-top:0}
.dat .k{flex:none;width:118px;color:var(--muted);font-size:12.5px;padding-top:1px}
.dat .v{flex:1;min-width:0;font-weight:600}
.dat li.placa .v::after{content:' · placa';font-weight:400;font-size:11.5px;color:var(--steel)}
.ref{padding:11px 14px;font-size:15px;font-weight:700;border-top:1px solid var(--line)}
.est{padding:10px 14px;font-size:12.5px;border-top:1px solid var(--line);color:var(--muted)}
.est b{color:var(--steel)}
.est.mal{background:var(--crit-bg);color:var(--crit-ink)}
.est.mal b{color:var(--crit-ink)}
.ver{padding:10px 14px;border-top:1px solid var(--line);background:var(--surface2);font-size:13px}
.ver .t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--steel);margin-bottom:5px}

details.sub{border-top:1px solid var(--line)}
details.sub>summary{cursor:pointer;padding:11px 14px;font-size:13px;color:var(--ink);font-weight:600;list-style:none}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary::after{content:' ▾';color:var(--muted)}
details.sub[open]>summary::after{content:' ▴'}

/* buscador */
.busca{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px;
  display:flex;gap:8px;align-items:center}
.busca input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--ground);color:var(--ink2)}
.busca input:focus{outline:2px solid var(--s2);outline-offset:1px}
#lista{list-style:none;margin:0;padding:0;max-height:46vh;overflow:auto}
#lista li{border-top:1px solid var(--line)}
#lista button{width:100%;text-align:left;font:inherit;background:none;border:0;padding:11px 16px;
  color:var(--ink2);cursor:pointer;display:flex;gap:10px;align-items:baseline}
#lista button:hover,#lista button:focus{background:var(--surface2)}
#lista .c{font-size:11.5px;font-weight:700;color:var(--muted);flex:none;width:66px}
.vacio{padding:14px;color:var(--muted);font-size:13.5px;text-align:center}
.pie-doc{padding:4px 16px 0;font-size:11.5px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="wrap">
  <div id="hero"></div>
  <div id="sello"></div>
  <div class="pad" id="cuerpo"></div>
  <p class="pie-doc" id="pie"></p>
</div>
<div class="busca">
  <input id="q" type="search" inputmode="search" placeholder="Buscar recinto por código o nombre" aria-label="Buscar recinto">
</div>
<ul id="lista" hidden></ul>
<script>

   buscarlos: en ese caso el botón de actualizar no tiene sentido y no se muestra.

const META = {CLIMA:{l:'Climatización',i:'Kuruf',c:'var(--s1)'},
              ELECTRICO:{l:'Eléctrico',i:'TyP',c:'var(--s2)'},
              SANITARIO:{l:'Sanitario',i:'MyM',c:'var(--s3)'}};
const ORD = ['CLIMA','ELECTRICO','SANITARIO'];
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return `${+d} ${MES[+m-1].slice(0,3)}` };
const larga = s => { const [y,m,d]=s.split('-'); return `${+d} de ${MES[+m-1]} de ${y}` };
const pct = q => (q*100).toFixed(0) + '%';

let D = null, idx = {}, fuente = '', aviso = '';
const guardado = () => { try { return localStorage.getItem(CACHE) } catch(e){ return null } };

function monta(d, origen){
  D = d; fuente = origen;
  idx = Object.fromEntries(d.rec.map(r => [r.r, r]));
}

// El corte semanal sirve para comparar semanas en el panel. Acá, parado en la puerta, la
// pregunta es otra: ¿este ítem está puesto HOY? Se lee toda la carga, y el sello dice de
// cuándo es esa carga para que nadie confunda una ficha vieja con la obra.
const puesto = it => !!it.f;

function avance(esp){
  let num=0, den=0, ok=0;
  for (const it of esp.it){ den += it.w; if(puesto(it)){ num += it.w; ok++ } }
  return {pond: den?num/den:0, ok, ap: esp.it.length};
}

function dias(){
  const gen = new Date(D.gen+'T00:00:00'), hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.round((hoy-gen)/86400000);
}

function sello(){
  const el = document.getElementById('sello');
  if (!D){ el.innerHTML = ''; return }
  const d = dias(), viejo = d >= 7, sinred = fuente === 'cache';
  const cuando = d===0 ? 'actualizada hoy' : d===1 ? 'hace 1 día' : `hace ${d} días`;
  el.innerHTML = `<div class="sello${sinred?' sinred':viejo?' viejo':''}">
    <span class="txt">${aviso ? '<b>'+esc(aviso)+'</b> · ' : ''}${sinred?'Sin señal. Estás viendo la copia guardada en este teléfono, ':'Avance según la última carga de los instaladores, '}al <b>${larga(D.gen)}</b> · ${cuando}${viejo&&!sinred?'. Confirma en terreno antes de decidir sobre este dato.':''}</span>
    ${EMBEBIDO ? '' : '<button id="btnAct" type="button">Actualizar</button>'}</div>`;
  const b = document.getElementById('btnAct');
  // Bajar el dato no es mostrarlo: hay que volver a pintar, o el botón miente en silencio.
  if (b) b.onclick = () => baja(true).then(() => ruta());
}

async function baja(manual){
  const b = document.getElementById('btnAct');
  if (b){ b.disabled = true; b.textContent = 'Buscando…' }
  try{
    const r = await fetch(FUENTE + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    const d = JSON.parse(txt);
    const igual = txt === guardado();
    try { localStorage.setItem(CACHE, txt) } catch(e){}
    const antes = D && D.gen;
    monta(d, 'red');
    aviso = manual ? (igual && antes === d.gen ? 'Ya estaba al día' : 'Datos actualizados') : '';
    return true;
  }catch(e){
    if (manual) aviso = 'No se pudo conectar';
    if (!D){ const g = guardado(); if (g){ monta(JSON.parse(g), 'cache'); return true } }
    return false;
  }
}

function pinta(cod){
  const r = idx[cod];
  sello();
  if (!r){ document.getElementById('cuerpo').innerHTML =
    `<div class="card"><p class="vacio">No encuentro <b>${esc(cod)}</b>. Búscalo abajo.</p></div>`;
    document.getElementById('hero').innerHTML = ''; return }

  // Un equipo no tiene piso, ni sector, ni cielo: tiene ubicación, familia y quien lo instala.
  const meta = r.eq
    ? `<span>${esc(r.p)}</span><span>${esc(r.s)}</span><span>${esc(r.t||'—')}</span>` +
      Object.keys(r.esp).map(e=>`<span>${esc(r.esp[e].i)}</span>`).join('')
    : `<span>${esc(r.p)}</span><span>Sector ${esc(r.s)}</span>
       <span>${esc(r.t||'—')}</span><span>Cielo ${esc(r.ci)}${r.cc&&r.cc!=='N/A'?' · '+esc(r.cc):''}</span>`;
  document.getElementById('hero').innerHTML = `<div class="hero">
    <img class="logo" src="${LOGO}" alt="Constructora Pitágora">
    <div class="cod">${esc(r.r)}</div>
    <h1>${esc(r.rn)}</h1>
    <div class="meta">${meta}</div>
  </div>`;

  let h = '';

  // La primera comprobación, antes de pegar la etiqueta: ¿es éste el equipo especificado?
  if (r.ee){
    const E = r.ee, mal = /RECHAZ/i.test(E.est);
    h += `<div class="card"><h2>Equipo especificado</h2>`
      + `<div class="ref">${esc(E.ref)}</div>`
      + `<ul class="dat">`
      + E.cl.filter(c=>c[1]).map(c=>`<li class="placa"><span class="k">${esc(c[0])}</span>`
          + `<span class="v">${esc(c[1])}</span></li>`).join('')
      + (E.ctx ? `<li><span class="k">Proyecto</span><span class="v">${esc(E.ctx)}</span></li>` : '')
      + `</ul>`
      + `<div class="est${mal?' mal':''}">Estado de recepción: <b>${esc(E.est)}</b>`
      + (E.fe ? ` · ${esc(fecha(E.fe))}` : '') + (E.doc ? ` · ${esc(E.doc)}` : '')
      + (E.ob ? `<br>${esc(E.ob)}` : '') + `</div>`
      + (E.ver ? `<div class="ver"><div class="t">Verificado en terreno</div>`
          + `<b>${esc(E.ver.m)}</b>${E.ver.fab?` · fabricado ${esc(E.ver.fab)}`:''}`
          + `<ul class="dat">` + E.ver.d.map(d=>`<li><span class="k">${esc(d[0])}</span>`
              + `<span class="v">${esc(d[1])}</span></li>`).join('') + `</ul>`
          + (E.ver.n ? `<div class="pie">${esc(E.ver.n)}</div>` : '') + `</div>` : '')
      + `</div>`;
  }
  const LADOT = {constructora:'Responde la constructora', mandante:'Responde el mandante o la ITO',
                 instalador:'Responde el instalador'};
  const CATT = {'DEFINICION DE PROYECTO':'definición de proyecto','INFORMACION':'información',
                'DECISION ADMINISTRATIVA':'decisión administrativa','CAPACIDAD':'capacidad · HH',
                'REVISAR':'sin clasificar'};
  if (r.obs.length) h += `<div class="card rojo"><h2>Restricción declarada</h2>` +
    r.obs.map(o => {
      const pie = o.c ? `<div class="pie">${esc(CATT[o.c]||o.c.toLowerCase())}`
        + (o.l ? ` · ${esc(LADOT[o.l]||o.l)}` : '')
        + (o.resp ? ` · ${esc(o.resp)}` : '')
        + (o.d ? ` · hace ${o.d} ${o.d===1?'día':'días'}` : '')
        + (o.fc ? ` · se libera el ${esc(fecha(o.fc))}` : ' · sin fecha de liberación')
        + `</div>` : '';
      return `<div class="it"><div class="cab"><span class="id">${esc(META[o.e].i)} · ${esc(META[o.e].l)}</span></div>
      ${esc(o.t)}${pie}</div>`;
    }).join('') + `</div>`;

  if (r.cmp.length) h += `<div class="card"><h2>Compromisos de la RCE en este recinto</h2>` +
    r.cmp.map(tema).join('') + `</div>`;

  h += `<div class="card"><h2>Avance por especialidad</h2>` + ORD.filter(e=>r.esp[e]).map(e => {
    const s = r.esp[e], a = avance(s), m = META[e];
    return `<div class="esp">
      <div class="enc">
        <div><div class="nom"><i class="sw" style="background:${m.c}"></i>${m.i} · ${m.l}</div>
          <div class="sub">${a.ok} de ${a.ap} ítems puestos</div></div>
        <div class="pc">${pct(a.pond)}</div>
      </div>
      <div class="barra"><i style="width:${(a.pond*100).toFixed(1)}%;background:${m.c}"></i></div>
      <div class="sub">Ponderado por incidencia. Por conteo simple, ${pct(a.ok/a.ap)}.</div>
      <ul class="items">${s.it.map(it => `<li class="${puesto(it)?'':'pend'}">
        <span class="tick ${puesto(it)?'si':'no'}">${puesto(it)?'✓':''}</span>
        <span class="d">${esc(it.d)}</span>
        <span class="f">${puesto(it)?fecha(it.f):'pendiente'}</span></li>`).join('')}</ul>
    </div>`}).join('') + `</div>`;

  if (r.zona.length) h += `<div class="card"><details class="sub"><summary>Compromisos de la zona o del piso · ${r.zona.length}</summary>
    ${r.zona.map(tema).join('')}
    <p class="nota">Estos temas no nombran este recinto en particular: alcanzan al piso, al sector o a un grupo de recintos.</p></details></div>`;

  document.getElementById('cuerpo').innerHTML = h;
  document.getElementById('pie').textContent =
    'Registro de la Coordinación de Especialidades · Clínica Veterinaria PUC · rombo y compromisos leídos del mismo instrumento.';
  document.title = r.r + ' · ' + r.rn;
}

function tema(t){
  return `<div class="it">
    <div class="cab"><span class="id">${esc(t.id)}</span>
      ${t.venc?'<span class="tag venc">Vencido</span>':''}
      ${t.est==='Permanente'?'<span class="tag perm">Permanente</span>':''}
      ${t.est==='En revisión'?'<span class="tag">En revisión</span>':''}</div>
    ${esc(t.d)}
    <div class="pie">${esc(t.esp)} · responsable ${esc(t.resp)}${t.fc?' · compromete el '+larga(t.fc):''}</div>
  </div>`;
}

/* ---------- buscador y ruteo por QR ---------- */
const q = document.getElementById('q'), lista = document.getElementById('lista');
function filtra(){
  const s = q.value.trim().toUpperCase();
  if (!s || !D){ lista.hidden = true; return }
  const hit = D.rec.filter(r => r.r.toUpperCase().includes(s) || r.rn.toUpperCase().includes(s)).slice(0,40);
  lista.innerHTML = hit.length
    ? hit.map(r => `<li><button type="button" data-c="${r.r}"><span class="c">${r.r}</span>
        <span>${esc(r.rn)} <span style="color:var(--muted)">· ${esc(r.p)}</span></span></button></li>`).join('')
    : `<li><p class="vacio">Sin coincidencias.</p></li>`;
  lista.hidden = false;
}
q.addEventListener('input', filtra);
lista.addEventListener('click', e => { const b = e.target.closest('button[data-c]'); if(!b) return;
  location.hash = b.dataset.c; q.value=''; lista.hidden = true; q.blur() });

const cod = () => decodeURIComponent(location.hash.replace(/^#/,'')).trim().toUpperCase();

// El QR pegado en la puerta trae el código en el hash. Si no hay hash se abre el buscador en
// vez de mostrar una página en blanco.
function ruta(){
  const c = cod();
  if (c){ pinta(c); window.scrollTo(0,0); return }
  sello();
  document.getElementById('hero').innerHTML = `<div class="hero">
    <img class="logo" src="${LOGO}" alt="Constructora Pitágora">
    <div class="cod">FICHA DE RECINTO Y EQUIPO</div><h1>Clínica Veterinaria PUC</h1>
    <div class="meta"><span>${D ? D.rec.filter(x=>!x.eq).length : 0} recintos</span>
      <span>${D ? D.rec.filter(x=>x.eq).length : 0} equipos</span>
      <span>Rombo y compromisos</span></div></div>`;
  document.getElementById('cuerpo').innerHTML =
    `<div class="card"><p class="vacio">Escanea el código pegado en la puerta del recinto o en el equipo,<br>o búscalo abajo por nombre.</p></div>`;
  document.title = 'Ficha de Recinto CVET';
  setTimeout(() => { try { q.focus({preventScroll:true}) } catch(e){} }, 120);
}
addEventListener('hashchange', ruta);

async function arranca(){
  if (EMBEBIDO){ monta(EMBEBIDO, 'embebido'); ruta(); return }
  const g = guardado();
  if (g){ try { monta(JSON.parse(g), 'cache'); ruta() } catch(e){} }   // pinta al tiro con lo guardado
  else document.getElementById('cuerpo').innerHTML =
    '<div class="card"><p class="vacio">Cargando el avance…</p></div>';
  await baja(false);
  if (D) ruta();
  else document.getElementById('cuerpo').innerHTML =
    '<div class="card"><p class="vacio">No se pudo cargar el avance y este teléfono no tiene copia guardada.<br>Revisa la señal y vuelve a intentar.</p></div>';
}

// Al volver a la ficha después de un rato —bolsillo, otra app— se revisa si hay carga nueva.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !EMBEBIDO) baja(false).then(ok => { if (ok) ruta() });
});
arranca();
</script>
</body></html>
